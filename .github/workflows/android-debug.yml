name: HeritageFaith V25 Unified Core Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Static HeritageFaith V25 continuity verification
        run: |
          python3 tools/verify_private_v20.py
          python3 tools/verify_private_v24.py
          python3 tools/verify_private_v25.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Prepare and hash APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HeritageFaith-V25-debug.apk
          sha256sum HeritageFaith-V25-debug.apk | tee HeritageFaith-V25-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: HeritageFaith-V25-debug-apk
          path: |
            HeritageFaith-V25-debug.apk
            HeritageFaith-V25-debug.apk.sha256
          if-no-files-found: error
