name: ARK V25.4 Mirror Sweep Permanent Signed APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify ARK / HeritageFaith continuity
        run: |
          python3 tools/verify_private_v20.py
          python3 tools/verify_private_v24.py
          python3 tools/verify_private_v25.py
          python3 tools/verify_ark_permanent.py
          python3 tools/verify_full_runtime_routes.py
          python3 tools/verify_import_all.py
          python3 tools/verify_mirror_sweep.py

      - name: Rehydrate permanent signing key
        env:
          ARK_KEYSTORE_B64: ${{ secrets.ARK_KEYSTORE_B64 }}
        run: |
          test -n "$ARK_KEYSTORE_B64"
          echo "$ARK_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ARK-PERMANENT-SIGNING-KEY.jks"
          chmod 600 "$RUNNER_TEMP/ARK-PERMANENT-SIGNING-KEY.jks"

      - name: Build permanently signed ARK release
        env:
          ARK_KEYSTORE_PATH: ${{ runner.temp }}/ARK-PERMANENT-SIGNING-KEY.jks
          ARK_STORE_PASSWORD: ${{ secrets.ARK_STORE_PASSWORD }}
          ARK_KEY_ALIAS: ${{ secrets.ARK_KEY_ALIAS }}
          ARK_KEY_PASSWORD: ${{ secrets.ARK_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify package, version, and signing certificate
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.arkforge.ark'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionCode='250400'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" ARK-V25.4-Mirror-Sweep.apk
          sha256sum ARK-V25.4-Mirror-Sweep.apk | tee ARK-V25.4-Mirror-Sweep.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ARK-V25.4-mirror-sweep-signed-apk
          path: |
            ARK-V25.4-Mirror-Sweep.apk
            ARK-V25.4-Mirror-Sweep.apk.sha256
          if-no-files-found: error
