plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arkforge.faith'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arkforge.faith'
        minSdk 26
        targetSdk 35
        versionCode 250001
        versionName '25.0.0-unified-core'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
