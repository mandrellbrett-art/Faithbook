plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arkforge.faith'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arkforge.ark'
        minSdk 26
        targetSdk 35
        versionCode 250400
        versionName '25.4.0-mirror-sweep'
    }

    signingConfigs {
        arkRelease {
            def p = System.getenv("ARK_KEYSTORE_PATH")
            if (p != null && !p.trim().isEmpty()) {
                storeFile file(p)
                storePassword System.getenv("ARK_STORE_PASSWORD")
                keyAlias System.getenv("ARK_KEY_ALIAS") ?: "ark"
                keyPassword System.getenv("ARK_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.arkRelease
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
