<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee6d5">
<title>HeritageFaith</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="top">
    <div class="brandrow"><div class="brand">HERITAGEFAITH</div><span class="badge">JESUS CENTERED</span><span class="badge">PRIVATE BY DEFAULT</span></div>
    <div id="runtimeStatus" class="status">Starting local runtime…</div>
    <nav id="nav" class="nav" aria-label="Primary"></nav>
  </header>
  <main id="view" tabindex="-1"><div class="card"><b>Opening HeritageFaith…</b><p class="muted">Preparing your private local study library.</p></div></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="sevenLeavesDialog" class="study-dialog"><form method="dialog" id="sevenLeavesForm" class="form"><div class="row"><div class="grow"><div class="tag">SEVEN COMMENTARY LEAVES</div><h2 id="sevenLeavesTitle">Passage study</h2><div id="sevenLeavesSubtitle" class="small muted"></div></div><button value="cancel" type="button" id="sevenLeavesClose">×</button></div><div id="sevenLeavesBody"></div><div class="actions"><button value="cancel" type="button" id="sevenLeavesDone">Done</button></div></form></dialog>
<dialog id="recordDialog"><form method="dialog" id="recordForm" class="form"><h2 id="recordDialogTitle">Record</h2><input type="hidden" id="recordId"><input type="hidden" id="recordType"><label>Title<input id="recordTitle" required maxlength="180"></label><label>Details<textarea id="recordBody" maxlength="50000"></textarea></label><label>Metadata JSON<textarea id="recordMeta" class="mono">{}</textarea></label><div class="actions"><button value="cancel" type="button" id="recordCancel">Cancel</button><button class="primary" value="save" type="submit">Save</button></div></form></dialog>
<script src="faith/faith-worksheets.js"></script>
<script src="faith/public-study-data.js"></script>
<script src="faith/jesus-study-data.js"></script>
<script src="faith/foundation-data.js"></script>
<script src="preview-bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
